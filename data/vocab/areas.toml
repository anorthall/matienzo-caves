# Canonical area names and the spellings the corpus uses for them.
#
# Generated from the corpus, then hand-checked. Case and accent variants
# are folded automatically by the normaliser and are not listed here;
# only spellings that folding cannot resolve need an entry.
#
# `matienzo build` fails if the corpus contains an area spelling that maps
# to nothing here, so a new one shows up as a build error rather than as a
# silently fragmented area.

