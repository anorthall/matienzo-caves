[project]
name = "matienzo-caves"
version = "0.1.0"
description = "Provide a useful, searchable interface to the Matienzo Caves Project's cave data"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Juan Corrin", email = "juancorrin@matienzo.org.uk" },
    { name = "Andrew Northall", email = "andrew@northall.me.uk" },
]
dependencies = [
    "lxml>=5.3",
    "pydantic>=2.10",
    "cyclopts>=3.1",
    "rich>=13.9",
    "utm>=0.8",
]

[project.optional-dependencies]
embed = ["fastembed>=0.5", "sqlite-vec>=0.1.6"]
mcp = ["mcp>=1.2"]
# The portal is the one part of the project that talks to the network, so it is
# the one part that is optional. A core install stays offline: no API key, no
# outbound calls, nothing to configure.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "anthropic>=0.69"]

[project.scripts]
matienzo = "matienzo.cli:main"
matienzo-mcp = "matienzo.mcp_server:main"
matienzo-web = "matienzo.web.app:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

# Mirrors the `embed` and `mcp` extras, and exists only so that a bare
# `uv run` keeps them installed. uv re-syncs the environment to the default
# dependency set on every run and has no `default-extras`, so without this,
# `uv run ruff check` between `matienzo embed` and `matienzo search --hybrid`
# silently uninstalls sqlite-vec and the next build dies on `no such module:
# vec0`. The extras stay the published interface; this only affects a checkout.
# `tests/test_packaging.py` asserts the two lists cannot drift apart.
local = [
    "fastembed>=0.5",
    "sqlite-vec>=0.1.6",
    "mcp>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "anthropic>=0.69",
]

[tool.uv]
default-groups = ["dev", "local"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["matienzo"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The corpus is full of Spanish accents and CP1252 curly quotes, and tests assert
# on those exact characters. "Ambiguous unicode" is the subject matter here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Standalone PEP-723 scripts under scripts/ are kept working and unchanged
# rather than restyled to the package's conventions.
"scripts/*.py" = ["B904"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["matienzo", "tests"]
# `scripts/download_htm.py` is a standalone PEP-723 script, deliberately kept
# working and unchanged; it is not part of the package and is not type-checked.
exclude = "^scripts/"

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Untyped imports are an
# error under strict mode, so each one is named here rather than blanket-ignored.
module = ["utm.*", "sqlite_vec.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: whole-corpus invariant checks"]
