# Reverse proxy for the portal.
#
# The four lines that matter are all in the /api/chat block, and every one of
# them addresses a failure that only appears in production.
#
# `proxy_buffering off` is the big one. nginx buffers proxied responses by
# default, and the result is not an error — it is the entire "streaming" answer
# arriving as a single blob when the response completes. Everything works,
# nothing logs, and the feature the whole event schema exists for silently does
# not happen. It cannot be reproduced against the app directly.
#
# The read timeout matters because a multi-hop answer can spend twenty seconds
# inside tool calls with nothing to say. The default 60s plus a slow question is
# a connection killed mid-answer. The app sends a keepalive comment every 15s,
# which is what keeps this from having to be unbounded.

upstream matienzo {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name caves.example.org;

    # ssl_certificate     /etc/letsencrypt/live/caves.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/caves.example.org/privkey.pem;

    # The portal reads the client address by index from the right of this
    # header, with MATIENZO_TRUSTED_PROXY_HOPS saying how many hops are ours.
    # If you add another proxy in front, raise that number to match — otherwise
    # rate limiting starts counting a header the client controls.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;

    client_max_body_size 64k;

    location /api/chat {
        proxy_pass http://matienzo;

        # Streaming. See the note above; these are not optional.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://matienzo;
        proxy_read_timeout 30s;
    }

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        proxy_pass http://matienzo;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}

server {
    listen 80;
    server_name caves.example.org;
    return 301 https://$host$request_uri;
}
